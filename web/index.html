<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perspective Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="editeur.css">
<style>
  .couleurs { display: flex; gap: 10px; margin: 6px 0 10px; }
  .couleurs label { flex: 1; display: grid; gap: 4px; font-size: 12px; }
  .couleurs input[type=color] { width: 100%; height: 30px; padding: 0; border: 1px solid #2b2e35; background: none; cursor: pointer; }
  #s-mode, #s-defaut { width: 100%; }
  #scene svg { border: 0; background: var(--fond, #0a0b0d); }
</style>
<style id="style-illustration"></style>
</head>
<body>
<main>
  <div class="outils">
    <button type="button" id="panneau" aria-keyshortcuts="H" aria-pressed="false">Masquer le panneau (H)</button>
    <button type="button" id="plein" aria-keyshortcuts="F">Plein écran (F)</button>
  </div>
  <div id="scene"></div>
  <p id="alerte" role="alert"></p>
</main>
<aside>
  <h1>ILLUSTRATION · <a href="editeur.html">éditeur de modèle</a></h1>
  <p class="aide" id="titre"></p>

  <fieldset>
    <legend>Commandes</legend>
    <div id="commandes"></div>
    <label class="coche"><input id="demo" type="checkbox"> Démonstration (les pièces bougent seules)</label>
    <label><span class="ligne">Vitesse<output id="o-vitesse"></output></span><input id="vitesse" type="range" min="0.2" max="2" step="0.1" value="1"></label>
  </fieldset>

  <fieldset>
    <legend>Style</legend>
    <label><span class="ligne">Rendu</span>
      <select id="s-mode"><option value="contours">Contours (traits seuls)</option><option value="couleurs">Couleurs d'origine</option></select></label>
    <div class="couleurs">
      <label>Fond<input id="s-fond" type="color"></label>
      <label>Contours<input id="s-trait" type="color"></label>
      <label>Teinte<input id="s-accent" type="color"></label>
    </div>
    <label class="coche"><input id="s-teinte" type="checkbox"> Teinter les pièces animées</label>
    <label><span class="ligne">Épaisseur du trait<output id="o-ep"></output></span><input id="s-ep" type="range" min="0.3" max="4" step="0.1" value="1.3"></label>
    <button type="button" id="s-defaut">Style par défaut</button>
  </fieldset>

  <fieldset>
    <legend>Caméra</legend>
    <label><span class="ligne">Rotation horizontale<output id="o-az"></output></span><input id="az" type="range" min="-180" max="180" step="1" value="38"></label>
    <label><span class="ligne">Rotation verticale<output id="o-el"></output></span><input id="el" type="range" min="-89" max="89" step="1" value="26"></label>
    <label><span class="ligne">Focale (équiv. 24×36)<output id="o-focale"></output></span><input id="focale" type="range" min="14" max="300" step="1" value="50"></label>
    <label><span class="ligne">Zoom (distance)<output id="o-zoom"></output></span><input id="zoom" type="range" min="0.5" max="3" step="0.05" value="1"></label>
  </fieldset>

  <fieldset>
    <legend>Fichier</legend>
    <div class="rang">
      <button type="button" id="export-html">Page HTML animée</button>
      <button type="button" id="export-svg">Image (.svg)</button>
      <button type="button" id="export-json">Modèle (.json)</button>
    </div>
    <label class="fichier">Charger un modèle<input id="charger" type="file" accept="application/json,.json"></label>
    <p class="aide" id="msg" role="status"></p>
  </fieldset>
</aside>
<script type="module" src="illustration.js"></script>
</body>
</html>
