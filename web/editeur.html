<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur de modèle — Perspective Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="editeur.css">
</head>
<body>
<main>
  <div class="outils">
    <button type="button" id="annuler" aria-keyshortcuts="Control+Z Meta+Z" disabled>Annuler</button>
    <button type="button" id="refaire" aria-keyshortcuts="Control+Y Meta+Shift+Z" disabled>Rétablir</button>
    <button type="button" id="panneau" aria-keyshortcuts="H" aria-pressed="false">Masquer le panneau (H)</button>
    <button type="button" id="plein" aria-keyshortcuts="F">Plein écran (F)</button>
  </div>
  <div id="scene"></div>
  <p id="alerte" role="alert"></p>
  <span id="info"></span>
</main>
<aside>
  <h1>ÉDITEUR_DE_MODÈLE · <a href="index.html">retour à l'illustration</a></h1>

  <fieldset>
    <legend>Pièces</legend>
    <div id="liste" role="group" aria-label="Pièces du modèle"></div>
    <div class="rang">
      <button type="button" data-ajout="boite">+ Boîte</button>
      <button type="button" data-ajout="cylindre">+ Cylindre</button>
      <button type="button" data-ajout="prisme">+ Prisme</button>
    </div>
    <div class="rang">
      <button type="button" id="dupliquer">Dupliquer</button>
      <button type="button" id="supprimer">Supprimer</button>
    </div>
  </fieldset>

  <fieldset id="piece">
    <legend>Pièce sélectionnée</legend>
    <div id="form"></div>
  </fieldset>

  <fieldset>
    <legend>Caméra</legend>
    <label><span class="ligne">Rotation horizontale<output id="o-az"></output></span><input id="az" type="range" min="-180" max="180" step="1" value="-35"></label>
    <label><span class="ligne">Rotation verticale<output id="o-el"></output></span><input id="el" type="range" min="-89" max="89" step="1" value="-25"></label>
    <label><span class="ligne">Focale (équiv. 24×36)<output id="o-focale"></output></span><input id="focale" type="range" min="14" max="300" step="1" value="35"></label>
    <label class="coche"><input id="auto" type="checkbox" checked> Garder le cadrage</label>
    <label><span class="ligne">Distance<output id="o-dist"></output></span><input id="dist" type="range" min="50" max="6000" step="5" value="600"></label>
  </fieldset>

  <fieldset>
    <legend>Fichier</legend>
    <label>Exemples
      <select id="exemple"><option value="">Choisir un exemple…</option></select>
    </label>
    <label>Nom du modèle<input id="nom-modele" type="text" maxlength="40"></label>
    <div class="rang">
      <button type="button" id="nouveau">Nouveau</button>
      <button type="button" id="enregistrer">Enregistrer (.json)</button>
      <button type="button" id="svg">Image (.svg)</button>
    </div>
    <label class="fichier">Charger un modèle<input id="charger" type="file" accept="application/json,.json"></label>
    <p class="aide" id="msg" role="status"></p>
  </fieldset>
</aside>
<script type="module" src="editeur.js"></script>
</body>
</html>
